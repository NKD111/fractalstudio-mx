<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#080808"/>
  <!-- Outer frame -->
  <rect x="1.5" y="1.5" width="29" height="29" stroke="#3BEA3B" stroke-width="0.75" stroke-opacity="0.3" fill="none"/>
  <!-- Diamond — creates visual "knot" intersection with squares -->
  <polygon points="16,2 30,16 16,30 2,16" stroke="#3BEA3B" stroke-width="1.2" stroke-opacity="0.7" fill="none"/>
  <!-- Inner square -->
  <rect x="9" y="9" width="14" height="14" stroke="#3BEA3B" stroke-width="1" stroke-opacity="0.55" fill="none"/>
  <!-- Center accent -->
  <rect x="13.5" y="13.5" width="5" height="5" fill="#3BEA3B"/>
</svg>
