<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Grain texture -->
    <filter id="grainProd" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Shallow DOF edge blur -->
    <filter id="edgeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <!-- Slight glow for highlights -->
    <filter id="highlightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Surface reflection blur -->
    <filter id="reflBlur" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <!-- Highlight streak -->
    <filter id="streakBlur" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="1 8"/>
    </filter>
    <!-- Background: dark radial -->
    <radialGradient id="bgProd" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <!-- Reflective surface gradient -->
    <linearGradient id="surfaceProd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <!-- Watch case gradient -->
    <linearGradient id="watchCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="30%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <!-- Watch dial gradient -->
    <radialGradient id="watchDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="80%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <!-- Highlight streak gradient -->
    <linearGradient id="highlightStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3BEA3B" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- DOF gradient mask -->
    <radialGradient id="dofMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Crown gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <!-- Shadow under watch -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflection gradient -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="dofMaskLayer">
      <radialGradient id="dofRadial" cx="50%" cy="50%" r="42%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="60%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
      <rect width="1200" height="800" fill="url(#dofRadial)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgProd)"/>

  <!-- Reflective table surface -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#surfaceProd)"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- Technical grid overlay (very subtle) -->
  <g stroke="#3BEA3B" stroke-width="0.4" opacity="0.06">
    <!-- Horizontal -->
    <line x1="0" y1="133" x2="1200" y2="133"/>
    <line x1="0" y1="267" x2="1200" y2="267"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="533" x2="1200" y2="533"/>
    <line x1="0" y1="667" x2="1200" y2="667"/>
    <!-- Vertical -->
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>
  <!-- Center crosshair -->
  <g stroke="#3BEA3B" stroke-width="0.5" opacity="0.12">
    <line x1="570" y1="390" x2="630" y2="390"/>
    <line x1="600" y1="360" x2="600" y2="420"/>
  </g>

  <!-- DOF blurred background elements -->
  <g filter="url(#edgeBlur)" opacity="0.3">
    <ellipse cx="300" cy="350" rx="60" ry="40" fill="#1e1e1e"/>
    <ellipse cx="900" cy="280" rx="50" ry="35" fill="#1e1e1e"/>
    <rect x="100" y="200" width="120" height="3" fill="#3BEA3B" opacity="0.2"/>
    <rect x="1000" y="300" width="100" height="3" fill="#3BEA3B" opacity="0.2"/>
  </g>

  <!-- Shadow beneath watch -->
  <ellipse cx="600" cy="535" rx="185" ry="22" fill="url(#shadowGrad)" opacity="0.9"/>

  <!-- WATCH main construction -->
  <!-- Lugs top-left -->
  <rect x="503" y="130" width="22" height="55" rx="5" fill="#1e1e1e"/>
  <rect x="503" y="130" width="22" height="55" fill="none" stroke="#333" stroke-width="0.6" rx="5"/>
  <!-- Lugs top-right -->
  <rect x="675" y="130" width="22" height="55" rx="5" fill="#1e1e1e"/>
  <rect x="675" y="130" width="22" height="55" fill="none" stroke="#333" stroke-width="0.6" rx="5"/>
  <!-- Lugs bottom-left -->
  <rect x="503" y="450" width="22" height="55" rx="5" fill="#1e1e1e"/>
  <rect x="503" y="450" width="22" height="55" fill="none" stroke="#333" stroke-width="0.6" rx="5"/>
  <!-- Lugs bottom-right -->
  <rect x="675" y="450" width="22" height="55" rx="5" fill="#1e1e1e"/>
  <rect x="675" y="450" width="22" height="55" fill="none" stroke="#333" stroke-width="0.6" rx="5"/>

  <!-- Strap top -->
  <path d="M 514 178 Q 530 185 600 185 Q 670 185 686 178 L 680 140 Q 665 148 600 150 Q 535 148 520 140 Z" fill="#111" opacity="0.9"/>
  <path d="M 514 178 Q 530 185 600 185 Q 670 185 686 178 L 680 140 Q 665 148 600 150 Q 535 148 520 140 Z" fill="none" stroke="#1e1e1e" stroke-width="0.5"/>
  <!-- Strap bottom -->
  <path d="M 514 455 Q 530 448 600 448 Q 670 448 686 455 L 680 493 Q 665 485 600 483 Q 535 485 520 493 Z" fill="#111" opacity="0.9"/>

  <!-- Watch case main body (octagonal luxury) -->
  <polygon points="524,200 676,200 716,240 716,445 676,485 524,485 484,445 484,240"
    fill="url(#watchCase)" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Bezel ring -->
  <polygon points="530,208 670,208 706,244 706,440 670,476 530,476 494,440 494,244"
    fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <polygon points="534,212 666,212 702,248 702,437 666,473 534,473 498,437 498,248"
    fill="none" stroke="#444" stroke-width="0.5"/>

  <!-- Watch crystal / dial area -->
  <polygon points="540,218 660,218 696,254 696,430 660,466 540,466 504,430 504,254"
    fill="url(#watchDial)"/>

  <!-- Dial outer ring -->
  <circle cx="600" cy="342" r="135" fill="none" stroke="#1e1e1e" stroke-width="1"/>
  <circle cx="600" cy="342" r="131" fill="none" stroke="#222" stroke-width="0.5"/>

  <!-- Minute markers (60 total, simplified to 12 main) -->
  <g stroke="#555" stroke-width="1" opacity="0.8">
    <line x1="600" y1="215" x2="600" y2="230"/> <!-- 12 -->
    <line x1="667" y1="235" x2="657" y2="247"/> <!-- 1 -->
    <line x1="708" y1="292" x2="697" y2="302"/> <!-- 2 -->
    <line x1="720" y1="358" x2="706" y2="358"/> <!-- 3 — longer -->
    <line x1="708" y1="418" x2="697" y2="406"/> <!-- 4 -->
    <line x1="667" y1="458" x2="656" y2="447"/> <!-- 5 -->
    <line x1="600" y1="468" x2="600" y2="453"/> <!-- 6 -->
    <line x1="533" y1="458" x2="544" y2="447"/> <!-- 7 -->
    <line x1="492" y1="418" x2="503" y2="406"/> <!-- 8 -->
    <line x1="480" y1="358" x2="494" y2="358"/> <!-- 9 — longer -->
    <line x1="492" y1="298" x2="503" y2="308"/> <!-- 10 -->
    <line x1="533" y1="244" x2="544" y2="256"/> <!-- 11 -->
  </g>
  <!-- Hour markers (thicker) -->
  <g stroke="#777" stroke-width="2.5">
    <line x1="600" y1="215" x2="600" y2="232"/>
    <line x1="720" y1="355" x2="703" y2="355"/>
    <line x1="600" y1="468" x2="600" y2="451"/>
    <line x1="480" y1="355" x2="497" y2="355"/>
  </g>

  <!-- Hour hand (pointing ~10 o'clock) -->
  <g transform="rotate(-60, 600, 342)">
    <rect x="596" y="272" width="8" height="80" rx="3" fill="#eee" opacity="0.9"/>
    <polygon points="600,262 606,276 594,276" fill="#eee" opacity="0.9"/>
    <rect x="597" y="280" width="6" height="2" fill="#3BEA3B" opacity="0.6"/>
  </g>

  <!-- Minute hand (pointing ~2 o'clock area) -->
  <g transform="rotate(55, 600, 342)">
    <rect x="597.5" y="238" width="5" height="110" rx="2" fill="#ddd" opacity="0.85"/>
    <polygon points="600,228 604,242 596,242" fill="#ddd" opacity="0.85"/>
  </g>

  <!-- Seconds hand (thin, green) -->
  <g transform="rotate(120, 600, 342)">
    <rect x="599.5" y="220" width="1" height="135" rx="0.5" fill="#3BEA3B" opacity="0.9"/>
    <rect x="598.5" y="355" width="3" height="40" rx="1" fill="#3BEA3B" opacity="0.5"/>
  </g>

  <!-- Center cap -->
  <circle cx="600" cy="342" r="8" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  <circle cx="600" cy="342" r="4" fill="#3BEA3B" opacity="0.7"/>
  <circle cx="600" cy="342" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Sub-dial at 6 o'clock (seconds register) -->
  <circle cx="600" cy="420" r="24" fill="none" stroke="#222" stroke-width="0.8"/>
  <circle cx="600" cy="420" r="20" fill="#0a0a0a"/>
  <g stroke="#333" stroke-width="0.6">
    <line x1="600" y1="400" x2="600" y2="404"/>
    <line x1="618" y1="407" x2="614" y2="410"/>
    <line x1="618" y1="433" x2="614" y2="430"/>
    <line x1="600" y1="440" x2="600" y2="436"/>
    <line x1="582" y1="433" x2="586" y2="430"/>
    <line x1="582" y1="407" x2="586" y2="410"/>
  </g>
  <line x1="600" y1="406" x2="600" y2="422" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="600" cy="420" r="2" fill="#555"/>

  <!-- Brand name on dial -->
  <text x="600" y="300" font-family="sans-serif" font-size="10" font-weight="600" fill="#888" text-anchor="middle" letter-spacing="4">CHRONO</text>
  <text x="600" y="314" font-family="sans-serif" font-size="7" font-weight="300" fill="#444" text-anchor="middle" letter-spacing="3">AUTOMATIC</text>
  <text x="600" y="392" font-family="monospace" font-size="7" fill="#3BEA3B" opacity="0.4" text-anchor="middle" letter-spacing="2">SWISS MADE</text>

  <!-- Crown (right side) -->
  <rect x="716" y="328" width="28" height="28" rx="5" fill="url(#crownGrad)"/>
  <rect x="716" y="328" width="28" height="28" fill="none" stroke="#555" stroke-width="0.6" rx="5"/>
  <!-- Crown ridges -->
  <g stroke="#666" stroke-width="0.8" opacity="0.5">
    <line x1="718" y1="334" x2="742" y2="334"/>
    <line x1="718" y1="338" x2="742" y2="338"/>
    <line x1="718" y1="342" x2="742" y2="342"/>
    <line x1="718" y1="346" x2="742" y2="346"/>
    <line x1="718" y1="350" x2="742" y2="350"/>
  </g>

  <!-- Main highlight streak across crystal -->
  <polygon points="525,218 580,218 556,466 500,466" fill="url(#highlightStreak)" opacity="0.18" filter="url(#streakBlur)"/>

  <!-- Secondary specular highlight (sharp) -->
  <rect x="516" y="250" width="5" height="90" fill="#ffffff" opacity="0.12" rx="2" filter="url(#highlightGlow)"/>

  <!-- Reflection on table surface -->
  <g filter="url(#reflBlur)" opacity="0.25">
    <polygon points="524,535 676,535 716,580 716,620 676,660 524,660 484,620 484,580"
      fill="url(#reflectionGrad)"/>
  </g>
  <line x1="484" y1="535" x2="716" y2="535" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>

  <!-- DOF blurred overlay rings (shallow DOF effect) -->
  <ellipse cx="600" cy="342" rx="420" ry="380" fill="none" stroke="#000" stroke-width="120" opacity="0.45"/>

  <!-- Technical annotations (left side) -->
  <g stroke="#3BEA3B" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="350" y1="200" x2="490" y2="230"/>
    <line x1="340" y1="200" x2="360" y2="200"/>
    <circle cx="335" cy="200" r="3" fill="#3BEA3B" opacity="0.4"/>
  </g>
  <text x="280" y="198" font-family="monospace" font-size="8" fill="#3BEA3B" opacity="0.3" letter-spacing="1">BEZEL: SAPPHIRE</text>

  <g stroke="#3BEA3B" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="350" y1="350" x2="480" y2="342"/>
    <line x1="340" y1="350" x2="360" y2="350"/>
    <circle cx="335" cy="350" r="3" fill="#3BEA3B" opacity="0.4"/>
  </g>
  <text x="230" y="348" font-family="monospace" font-size="8" fill="#3BEA3B" opacity="0.3" letter-spacing="1">CASE: GRADE 5 Ti</text>

  <!-- Technical annotations (right side) -->
  <g stroke="#3BEA3B" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="720" y1="200" x2="850" y2="180"/>
    <line x1="850" y1="180" x2="870" y2="180"/>
  </g>
  <text x="875" y="183" font-family="monospace" font-size="8" fill="#3BEA3B" opacity="0.3" letter-spacing="1">∅ 41mm CASE</text>

  <g stroke="#3BEA3B" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="720" y1="342" x2="850" y2="342"/>
    <line x1="850" y1="342" x2="870" y2="342"/>
  </g>
  <text x="875" y="345" font-family="monospace" font-size="8" fill="#3BEA3B" opacity="0.3" letter-spacing="1">CAL. FX-9001</text>

  <!-- Bottom label -->
  <text x="600" y="760" font-family="monospace" font-size="10" fill="#3BEA3B" opacity="0.5" text-anchor="middle" letter-spacing="5">FOTOGRAFÍA DE PRODUCTO</text>
  <line x1="360" y1="768" x2="840" y2="768" stroke="#3BEA3B" stroke-width="0.4" opacity="0.2"/>
  <line x1="360" y1="768" x2="360" y2="768" stroke="#3BEA3B" stroke-width="0.4" opacity="0.2"/>
  <text x="600" y="782" font-family="monospace" font-size="8" fill="#444" text-anchor="middle" letter-spacing="3">FRACTAL STUDIO MX · MACRO EDITORIAL</text>

  <!-- Grain overlay -->
  <rect width="1200" height="800" fill="#000" opacity="0.06" filter="url(#grainProd)"/>
</svg>
